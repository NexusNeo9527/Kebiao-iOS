name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app and widget
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Xcode 16.4 is the macOS 15 image default and has the installed iOS 18.5
      # simulator device set. Newer Xcode SDKs can exist without an attached
      # runtime on individual hosted runners, which makes all tests unreachable.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure an iOS simulator is available
        run: |
          set -e
          RUNTIME_ID=$(xcrun simctl list runtimes available -j | jq -r '.runtimes | map(select(.isAvailable == true and .version == "18.5" and (.identifier | contains("iOS")))) | first | .identifier // empty')
          if [ -z "$RUNTIME_ID" ]; then
            echo "No installed iOS runtime; downloading iOS 18.5 for Xcode 16.4..."
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | jq -r '.runtimes | map(select(.isAvailable == true and .version == "18.5" and (.identifier | contains("iOS")))) | first | .identifier // empty')
          fi
          test -n "$RUNTIME_ID"

          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices[][] | select(.name == "Kebiao CI iPhone") | .udid' | head -1)
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl create "Kebiao CI iPhone" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$RUNTIME_ID")
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Using runtime $RUNTIME_ID on simulator $DEVICE_ID"

      - name: Run unit tests
        run: >-
          xcodebuild
          -project Kebiao.xcodeproj
          -scheme Kebiao
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project Kebiao.xcodeproj
          -scheme Kebiao
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify free Sideloadly Live Activity package
        run: >-
          bash scripts/verify-free-sideloadly.sh
          build/DerivedData/Build/Products/Debug-iphonesimulator/Kebiao.app

      - name: Capture visual QA screenshots
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/Kebiao.app"
          DEVICE_ID="$SIMULATOR_UDID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          mkdir -p build/visual-qa

          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.example.kebiao
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/visual-qa/day-schedule.png

          xcrun simctl terminate "$DEVICE_ID" com.example.kebiao
          xcrun simctl launch "$DEVICE_ID" com.example.kebiao --ui-test-add-course
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/visual-qa/add-course.png

          xcrun simctl terminate "$DEVICE_ID" com.example.kebiao
          xcrun simctl launch "$DEVICE_ID" com.example.kebiao --ui-test-import
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/visual-qa/school-import.png

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v7
        with:
          name: Kebiao-visual-qa
          path: build/visual-qa/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: Kebiao-simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Kebiao.app
          if-no-files-found: error
          retention-days: 7
